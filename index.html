<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (security report H-14). The bearer token lives in
      sessionStorage, so a script that runs in this origin owns the account;
      this is the page-level line against that. Kept deliberately tight:
        script-src 'self'                 nothing inline, nothing third-party
        style-src  'self'                 NO Google Fonts. The two typefaces are
                                          self-hosted in /fonts (see index.css):
                                          the HUB serves this same bundle on a
                                          monitor, over a radio that can be down,
                                          and two failed stylesheet fetches took
                                          every heading in the product down to a
                                          system fallback. Self-hosting also lets
                                          this policy drop two third parties from
                                          the path of a control-room screen.
        font-src   'self'                 same origin, 68 KB, four woff2 files
        img-src    'self' data: blob:     /icons, /media, and camera snapshots
        media-src  'self' blob: https:    hub-archived playback is a <video>
                                          src on the COORDINATION origin (the
                                          segment stream); blob: keeps the older
                                          Blob path; live video is a MediaStream,
                                          no URL. Like connect-src, vite.config.ts
                                          narrows the https: to the exact
                                          coordination origin at BUILD.
        connect-src 'self' https:         fetch to coordination over HTTPS.
                                          vite.config.ts narrows this at BUILD
                                          to the exact VITE_COORDINATION_URL
                                          origin, and relaxes it in dev.
      frame-ancestors cannot travel in a <meta>; vercel.json sets it, with
      HSTS, nosniff and X-Frame-Options, at the edge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- `dark light`, not `dark`. This tells the browser both are supported,
         so form controls and the scrollbar follow whichever theme is active;
         `lib/theme.ts` sets the exact one on <html> as a style. Leaving this
         `dark` made a light-theme page keep dark native controls. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Terra Sentinel operations monitoring portal."
    />
    <title>Sentinel — TWR-1042</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- NO FONT <link>. Quantico and Sora are declared in src/index.css and
         served from /fonts on this origin. There is nothing to preconnect to:
         this page must render completely with no internet, because the hub
         serves it to a monitor at a site whose uplink is a radio. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
